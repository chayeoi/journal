<script>
/* ============================================================
   집필진 목록 렌더
   ============================================================ */
function specChips(au, max){
  var specs = authorSpecialties(au.id);
  if (typeof max === "number") specs = specs.slice(0, max);
  return specs.map(function(c){ return '<span class="aspec">'+c.name+'</span>'; }).join('');
}
function authorCardHTML(au){
  return ''
  + '<article class="acard">'
  + '  <a class="acard__link" href="'+authorUrl(au)+'" aria-label="'+au.name+' 프로필">'
  +        authorAvatarHTML(au, 60)
  + '    <span class="acard__main">'
  + '      <span class="acard__name">'+au.name+'</span>'
  + '      <span class="acard__bio">'+au.bio+'</span>'
  + '    </span>'
  + '    <span class="acard__go" aria-hidden="true">'+ICON.arrow+'</span>'
  + '  </a>'
  + '</article>';
}
function renderAuthors(){
  var list = authorsBySeniority();
  document.getElementById('author-list').innerHTML = list.map(authorCardHTML).join('');
  updateAuthorsLD(list);
}
function updateAuthorsLD(list){
  var ORIGIN = "https://fightingspirit.kr";
  var data = {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "집필진 — AUCTORITAS LAB",
    "description": "공간분쟁 전문 변호사진의 약력과 담당 분야, 집필 아티클.",
    "url": ORIGIN + "/authors",
    "mainEntity": {
      "@type": "ItemList",
      "numberOfItems": list.length,
      "itemListElement": list.map(function(au, i){
        return {
          "@type": "ListItem",
          "position": i + 1,
          "url": ORIGIN + "/authors/" + au.id,
          "item": {
            "@type": "Person",
            "name": au.name,
            "description": au.bio,
            "url": ORIGIN + "/authors/" + au.id,
            "worksFor": { "@type": "Organization", "name": "AUCTORITAS LAB", "url": ORIGIN }
          }
        };
      })
    }
  };
  document.getElementById('ld-authors').textContent = JSON.stringify(data);
}

renderAuthors();
renderFooter();

/* hide header on scroll-down, reveal on scroll-up */
(function(){
  var header = document.querySelector('.site-header');
  if(!header) return;
  var lastY = window.scrollY, ticking = false;
  function update(){
    var y = window.scrollY, delta = y - lastY;
    if (Math.abs(delta) > 6){
      if (delta > 0 && y > 80) header.setAttribute('data-hidden','true');
      else header.removeAttribute('data-hidden');
      lastY = y;
    }
    ticking = false;
  }
  window.addEventListener('scroll', function(){ if(!ticking){ window.requestAnimationFrame(update); ticking = true; } }, { passive: true });
})();
</script>
