<!DOCTYPE html>
<html lang="ko" data-page="author" data-shape="rounded" data-card="list" data-thumb="on" data-font="pretendard" style="--accent:#3B82F6">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>집필진 — AUCTORITAS LAB</title>
<meta name="description" content="AUCTORITAS LAB 변호사 프로필.">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<link rel="canonical" href="https://fightingspirit.kr/authors">
<link rel="stylesheet" href="ds-system.css">
<link rel="stylesheet" href="journal.css">
<link rel="stylesheet" href="authors.css">
<script type="application/ld+json" id="ld-author"></script>
<script>/* pre-paint: apply persisted tweaks before first render */
(function(){try{var d=JSON.parse(localStorage.getItem("auctoritas.tweaks.v4")||"{}"),r=document.documentElement;r.style.setProperty("--accent","#3B82F6");if(d.font)r.setAttribute("data-font",d.font);r.setAttribute("data-thumb",d.thumb||"on");r.setAttribute("data-shape","rounded");r.setAttribute("data-card","list");r.setAttribute("data-tagstyle",d.tagstyle||"hash");}catch(e){}})();</script>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="site-header">
  <div class="site-header__in">
    <a class="brand" href="index.html">AUCTORITAS LAB</a>
  </div>
</header>

<main class="wrap" id="author-main"></main>

<!-- ============ FOOTER ============ -->
<div id="footer"></div>
<div id="tweaks-root"></div>

<script src="data.js"></script>
<script src="footer.js"></script>
<script>
/* ============================================================
   작가 상세 — ?id= 로 조회
   ============================================================ */
function getAuthor(){
  var id = new URLSearchParams(location.search).get("id");
  return (id && AUTHORS[id]) ? AUTHORS[id] : null;
}

function renderAuthor(){
  var au = getAuthor();
  var main = document.getElementById('author-main');

  if (!au){
    main.innerHTML = ''
    + '<nav class="breadcrumb" aria-label="위치"><a href="index.html">홈</a><span aria-hidden="true">›</span><a href="authors.html">집필진</a></nav>'
    + '<div class="author-empty"><h3>변호사를 찾을 수 없어요</h3><p>주소가 올바른지 확인하거나 집필진 목록에서 다시 선택해 주세요.</p>'
    + '<p style="margin-top:20px"><a class="btn btn--ghost btn--sm" href="authors.html">집필진 목록으로</a></p></div>';
    document.title = "집필진 — AUCTORITAS LAB";
    return;
  }

  document.title = au.name + " — AUCTORITAS LAB";
  var posts = articlesByAuthor(au.id);
  var n = posts.length;

  var heroAvatar = au.avatar_url
    ? '<img class="aprofile__avatar aprofile__avatar--img" src="'+au.avatar_url+'" alt="'+au.name+'">'
    : '<span class="avatar avatar--dark aprofile__avatar" aria-hidden="true">'+au.name.charAt(0)+'</span>';

  var hero = ''
  + '<nav class="breadcrumb" aria-label="위치">'
  + '  <a href="index.html">홈</a><span aria-hidden="true">›</span>'
  + '  <a href="authors.html">집필진</a><span aria-hidden="true">›</span>'
  + '  <span>'+au.name+'</span>'
  + '</nav>'
  + '<header class="aprofile">'
  + '  ' + heroAvatar
  + '  <div class="aprofile__text">'
  + '    <p class="eyebrow aprofile__eyebrow">집필진 · CONTRIBUTOR</p>'
  + '    <h1 class="aprofile__name">'+au.name+'</h1>'
  + '    <p class="aprofile__bio">'+au.bio+'</p>'
  + '    <div class="aprofile__meta">'
  + '      <span><b>'+n+'</b>편의 아티클</span>'
  + '    </div>'
  + '  </div>'
  + '</header>';

  var postsSection = ''
  + '<section class="aposts" aria-labelledby="ap-h">'
  + '  <div class="sec__head">'
  + '    <div>'
  + '      <h2 class="sec__title" id="ap-h">작성한 글</h2>'
  + '      <p class="sec__sub">총 '+n+'편</p>'
  + '    </div>'
  + '    <a class="sec__link" href="index.html?author='+au.id+'">더 보기 '+ICON.arrow+'</a>'
  + '  </div>'
  + (n
      ? '<div class="cardgrid">'+posts.map(function(a){ return cardHTML(a); }).join('')+'</div>'
      : '<div class="author-empty"><p>아직 발행된 글이 없어요.</p></div>')
  + '</section>';

  main.innerHTML = hero + postsSection;
  updateAuthorLD(au, posts);
}

function updateAuthorLD(au, posts){
  var ORIGIN = "https://fightingspirit.kr";
  var url = ORIGIN + "/authors/" + au.id;
  var person = {
    "@type": "Person",
    "name": au.name,
    "description": au.bio,
    "url": url,
    "worksFor": { "@type": "Organization", "name": "AUCTORITAS LAB", "url": ORIGIN },
    "subjectOf": posts.slice(0, 10).map(function(a){
      return { "@type": "Article", "headline": a.title, "url": ORIGIN + "/" + articleUrl(a) };
    })
  };
  var data = {
    "@context": "https://schema.org",
    "@graph": [
      { "@type": "ProfilePage", "url": url, "name": au.name + " — AUCTORITAS LAB", "mainEntity": person },
      { "@type": "BreadcrumbList", "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "홈", "item": ORIGIN },
        { "@type": "ListItem", "position": 2, "name": "집필진", "item": ORIGIN + "/authors" },
        { "@type": "ListItem", "position": 3, "name": au.name }
      ]}
    ]
  };
  document.getElementById('ld-author').textContent = JSON.stringify(data);
}

renderAuthor();
renderFooter();

/* hide header on scroll-down, reveal on scroll-up */
(function(){
  var header = document.querySelector('.site-header');
  if(!header) return;
  var lastY = window.scrollY, ticking = false;
  function update(){
    var y = window.scrollY, delta = y - lastY;
    if (Math.abs(delta) > 6){
      if (delta > 0 && y > 80) header.setAttribute('data-hidden','true');
      else header.removeAttribute('data-hidden');
      lastY = y;
    }
    ticking = false;
  }
  window.addEventListener('scroll', function(){ if(!ticking){ window.requestAnimationFrame(update); ticking = true; } }, { passive: true });
})();
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="tweaks-journal.jsx"></script>
</body>
</html>
